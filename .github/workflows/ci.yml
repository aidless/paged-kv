name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The whole project is three C++ test binaries: block manager, KV cache
    # slot mapping + decode path, and the prefix cache chain.
    runs-on: ubuntu-latest
    steps:
      - actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and run the test suite
        run: make test
