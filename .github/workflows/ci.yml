name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The whole project is three C++ test binaries: block manager, KV cache
    # slot mapping + decode path, and the prefix cache chain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and run the test suite
        run: make test
